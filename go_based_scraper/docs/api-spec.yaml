openapi: 3.0.3
info:
  title: Call4Paper API
  version: 0.3.0
  description: |
    Contract shared by the Python (FastAPI) and Go backends. The Android client
    must not behave differently depending on which backend answers.

    Conventions:
      - All responses are JSON. Errors use {"detail": "..."} unless noted.
      - A NULL database column serialises to JSON null, NEVER "". Both backends
        map an absent deadline/optional field to null so the client sees one shape.
      - Dates are ISO-8601 strings ("YYYY-MM-DD" for dates, e.g. "2026-11-27").
      - Read paths are anonymous, cached, and rate-limited per client IP.
      - Write paths (/auth/logout, /me*, /me/devices, /me/bookmarks) require a
        Bearer JWT. Internal paths (/internal/*) require the X-Notify-Secret header.
security:
  - bearer: []
  - internalsecret: []

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "HS256 token signed with JWT_SECRET. Claims: sub, email, tv, exp, iat."
    internalsecret:
      type: apiKey
      in: header
      name: X-Notify-Secret

  schemas:
    ConferenceOut:
      type: object
      required: [id, name]
      description: |
        One conference. Nullable fields are JSON null when absent (never "").
        status is "upcoming" when the nearest submission deadline is today or
        later, "past" when it has passed, and null for a TBA record with no
        deadline. bookmarked is null for anonymous callers, true/false otherwise.
    UserOut:
      type: object
      required: [id, username, email, created_at]
      properties:
        id: {type: string}
        username: {type: string}
        email: {type: string}
        created_at: {type: string, format: date-time}
    LoginOut:
      type: object
      required: [token, user]
      properties:
        token: {type: string}
        user:
          $ref: '#/components/schemas/UserOut'
    OkOut:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
    DetailError:
      type: object
      required: [detail]
      properties:
        detail: {type: string}
    MarkerOut:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
        targets: {type: integer}
        sent: {type: integer}
        logged: {type: integer}
        devices: {type: integer}
        message: {type: string}

paths:
  /health:
    get:
      tags: [operational]
      summary: Liveness probe (anonymous).
      security: []
      responses:
        '200':
          description: OK when the database is reachable.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean}
        '503':
          description: Database unreachable.

  /auth/login:
    post:
      tags: [auth]
      summary: Sign in with a Google or Firebase ID token; issues a JWT.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, id_token]
              properties:
                provider:
                  type: string
                  enum: [google, firebase]
                id_token: {type: string}
                phone_model: {type: string}
                device_info: {type: string}
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOut'
        '400':
          description: Missing fields, bad provider, or token missing claims.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        '401':
          description: Invalid provider token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        '403':
          description: Account was deleted and is still within the restore grace period.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        '409':
          description: Email already registered with another provider.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        '429':
          description: Too many login attempts from this IP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        '503':
          description: Auth backend not configured (e.g. Google sign-in).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the caller's JWT by bumping their token version.
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkOut' }

  /me:
    get:
      tags: [users]
      summary: Caller's profile.
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserOut' }
        '404':
          description: User not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
    delete:
      tags: [users]
      summary: Soft-delete the caller's account; revokes tokens.
      responses:
        '200':
          description: Soft-deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkOut' }

  /conferences/calendar:
    get:
      tags: [conferences]
      summary: Conferences with a submission deadline inside a month.
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          description: YYYY-MM; deadlines in [start, end) of that month.
      responses:
        '200':
          description: Matching conferences, soonest deadline first (<= 500).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConferenceOut' }
        '400':
          description: Invalid month.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  /conferences/upcoming:
    get:
      tags: [conferences]
      summary: Conferences with at least one open submission deadline.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
          description: Page size, paginated over conferences (not deadline rows).
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Open conferences, soonest deadline first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConferenceOut' }

  /conferences/{conf_id}:
    get:
      tags: [conferences]
      summary: One conference by id; bookmarked flag when signed in.
      parameters:
        - name: conf_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Conference. bookmarked omitted when anonymous.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConferenceOut' }
        '400':
          description: Invalid id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        '404':
          description: Not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  # --- Versioned public API (additive superset of the unversioned reads) ---
  # The unversioned paths above remain the shared contract both backends serve.
  # The Go backend additionally serves these under /api/v1 as the versioned
  # public API. They are byte-identical to the unversioned responses; the three
  # conference reads are rate-limited per client IP (429 when over budget).
  /api/v1/health:
    get:
      tags: [operational]
      summary: Liveness probe (anonymous).
      security: []
      responses:
        '200':
          description: OK when the database is reachable.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean}
        '503':
          description: Database unreachable.

  /api/v1/conferences/calendar:
    get:
      tags: [conferences]
      summary: Conferences with a submission deadline inside a month (rate-limited).
      security: []
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          description: YYYY-MM; deadlines in [start, end) of that month.
      responses:
        '200':
          description: Matching conferences, soonest deadline first (<= 500).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConferenceOut' }
        '400':
          description: Invalid month.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        '429':
          description: Too many requests from this client IP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  /api/v1/conferences/upcoming:
    get:
      tags: [conferences]
      summary: Conferences with at least one open submission deadline (rate-limited).
      security: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Open conferences, soonest deadline first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConferenceOut' }
        '429':
          description: Too many requests from this client IP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  /api/v1/conferences/{conf_id}:
    get:
      tags: [conferences]
      summary: One conference by id; bookmarked flag when signed in (rate-limited).
      security: []
      parameters:
        - name: conf_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Conference. bookmarked omitted when anonymous.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConferenceOut' }
        '400':
          description: Invalid id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        '404':
          description: Not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        '429':
          description: Too many requests from this client IP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  /me/bookmarks:
    get:
      tags: [bookmarks]
      summary: Caller's bookmarked conferences, soonest deadline first.
      responses:
        '200':
          description: Bookmarked conferences (bookmarked=true).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConferenceOut' }

  /me/bookmarks/{conf_id}:
    post:
      tags: [bookmarks]
      summary: Bookmark a conference (idempotent).
      parameters:
        - name: conf_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '201':
          description: Bookmarked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkOut' }
        '404':
          description: Conference not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
    delete:
      tags: [bookmarks]
      summary: Remove a bookmark (idempotent).
      parameters:
        - name: conf_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Removed.

  /me/devices:
    post:
      tags: [devices]
      summary: Register or refresh the caller's FCM token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcm_token]
              properties:
                fcm_token:
                  type: string
                  minLength: 10
                  maxLength: 500
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkOut' }
        '400':
          description: Missing or invalid fcm_token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        '409':
          description: Token already registered to another user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  /me/devices/{token}:
    delete:
      tags: [devices]
      summary: Remove the caller's FCM token.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Removed.

  /internal/notify-scraper-run:
    post:
      tags: [internal]
      summary: Bust conference caches after a scraper pass; send a digest push.
      responses:
        '200':
          description: Caches busted and/or digest sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarkerOut' }

  /internal/notify-bookmarks:
    post:
      tags: [internal]
      summary: Push deadline alerts for bookmarked conferences.
      responses:
        '200':
          description: Alerts delivered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarkerOut' }

  /internal/notify-digest:
    post:
      tags: [internal]
      summary: Broadcast the morning or evening digest to the topic.
      parameters:
        - name: time_of_day
          in: query
          required: false
          schema:
            type: string
            enum: [morning, evening]
            default: morning
      responses:
        '200':
          description: Broadcast sent.
          content:
            application/json:
              schema:
                type: object
                required: [ok, sent]
                properties:
                  ok: { type: boolean }
                  sent: { type: boolean }
                  topic: { type: string }
                  body: { type: string }

  /internal/notify-daily:
    post:
      tags: [internal]
      summary: "Combined daily pass: bust caches, broadcast digest, bookmark alerts."
      responses:
        '200':
          description: Combined result.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }

tags:
  - { name: operational, description: Health and liveness. }
  - { name: auth, description: Sign-in, sign-out. }
  - { name: users, description: Caller profile and account deletion. }
  - { name: conferences, description: Anonymous conference reads. }
  - { name: bookmarks, description: Caller bookmark management. }
  - { name: devices, description: Caller FCM device registration. }
  - { name: internal, description: Cron/scheduled jobs, gated by X-Notify-Secret. }
