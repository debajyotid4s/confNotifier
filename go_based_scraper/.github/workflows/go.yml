name: Go CI

on:
  push:
    branches: [main]
    paths:
      - "go_based_scraper/**"
  pull_request:
    paths:
      - "go_based_scraper/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go_based_scraper/go.sum

      - name: Format check
        working-directory: go_based_scraper
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: go_based_scraper
        run: go vet ./...

      - name: Race-detector tests
        working-directory: go_based_scraper
        run: go test -race -count=1 -timeout=30s ./...

      - name: Vuln check
        working-directory: go_based_scraper
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Build
        working-directory: go_based_scraper
        run: CGO_ENABLED=0 go build ./...
