services:
  - type: web
    name: call4paper-api
    env: python
    region: singapore
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NOTIFY_SECRET
        generateValue: true
      - key: GOOGLE_AUTH_DISABLE
        value: 0
