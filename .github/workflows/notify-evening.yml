name: Evening digest
on:
  schedule:
    - cron: '0 13 * * *'  # 19:00 BDT (UTC+6)
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf -X POST "https://confnotifier.onrender.com/internal/notify-digest?time_of_day=evening" \
            -H "X-Notify-Secret: ${{ secrets.NOTIFY_SECRET }}"
