name: CI — Package smoke test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install package
        run: pip install -e '.[dev]'

      - name: Import smoke test
        run: python -c "import scraper.main, scraper.verify_deadlines, scraper.send_reminders"

      - name: Run unit tests
        run: python -m pytest tests/ -q
