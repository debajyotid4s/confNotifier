name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conftest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/conftest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install package
        run: pip install -e '.[dev]'

      - name: Import smoke test
        run: python -c "import scraper.main, scraper.verify_deadlines, scraper.send_reminders"

      - name: Lint for unused imports and undefined names
        run: python -m pyflakes scraper api tests

      # Builds the whole schema from nothing using the single canonical
      # schema file, twice — the second run proves it is idempotent.
      # There are no versioned migration files: schema changes are applied
      # by hand in the Neon SQL editor while the work happens, and
      # db/schema_base.sql is updated in the same commit to match.
      - name: Apply canonical schema (twice, proving idempotency)
        run: |
          set -e
          export PGPASSWORD=postgres
          psql_run() { psql -h localhost -U postgres -d conftest -v ON_ERROR_STOP=1 -q -f "$1"; }
          echo "== db/schema_base.sql (1st run)"
          psql_run db/schema_base.sql
          echo "== db/schema_base.sql (2nd run)"
          psql_run db/schema_base.sql

      - name: Install API dependencies
        run: pip install -r api/requirements.txt

      - name: Verify the API imports and every route registers
        run: |
          cd api
          JWT_SECRET=ci-test NOTIFY_SECRET=ci-test python -c "
          import main
          paths = main.app.openapi()['paths']
          assert len(paths) >= 15, f'expected >=15 endpoints, got {len(paths)}'
          print(f'{len(paths)} endpoints registered')
          "

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Roles + backup/restore gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/conftest
        run: |
          bash db/maint.sh verify
