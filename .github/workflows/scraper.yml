name: BD Conference Scraper

on:
  schedule:
    - cron: "0 0,6,12,16,18 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(python -c 'import playwright; print(playwright.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v${{ steps.pw-version.outputs.version }}

      - name: Verify cached Playwright browsers
        id: pw-check
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          if python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(headless=True)
              b.close()
          " 2>/dev/null; then
            echo "browser-ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser-ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true' || steps.pw-check.outputs.browser-ok == 'false'
        run: playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper/main.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          GOOGLE_AI_KEY_2: ${{ secrets.GOOGLE_AI_KEY_2 }}
          GOOGLE_AI_KEY_3: ${{ secrets.GOOGLE_AI_KEY_3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHANNEL_LINK: ${{ secrets.TELEGRAM_CHANNEL_LINK }}

      - name: Notify bookmarked users
        if: always()
        run: |
          curl -sf -X POST "https://confnotifier.onrender.com/internal/notify-bookmarks" \
            -H "X-Notify-Secret: ${{ secrets.NOTIFY_SECRET }}" || true
