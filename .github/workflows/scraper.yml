name: BD Conference Scraper

on:
  schedule:
    - cron: "0 0,6,12,16,18 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1.60

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Run scraper
        run: PYTHONPATH=. python scraper/main.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          GOOGLE_AI_KEY_2: ${{ secrets.GOOGLE_AI_KEY_2 }}
          GOOGLE_AI_KEY_3: ${{ secrets.GOOGLE_AI_KEY_3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHANNEL_LINK: ${{ secrets.TELEGRAM_CHANNEL_LINK }}
