name: Go Scraper

# Dispatch-only: runs on demand (GitHub UI -> Actions -> "Run workflow"), never
# on a schedule. There is no `schedule:` block, so this workflow never fires on
# a cron. Manual runs only take effect once this file is on the default branch.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: discovery + extraction only; no DB writes or Telegram posts'
        type: boolean
        default: false

# Same group name as scraper.yml (Python scrape) so GitHub never runs the two
# scrape workflows at once, even by mistake. (Go CI uses its own group — it is
# a test job, not a scrape, and must not be blocked by a manual run.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    # ~2294 candidates from the crt.sh sweep; at RPM 30 the 1000/day (RPD) quota
    # needs ~65-70 min to exhaust, so 60 min was too tight and cancelled the run.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # docker/build-push-action caches the image layers; Chromium and the go
      # module layer rebuild only when they actually change.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./go_based_scraper
          file: go_based_scraper/Dockerfile.api
          push: false
          tags: confnotifier:go
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run scrape
        run: |
          # Dry-run (discovery + extraction only, no DB writes / Telegram posts)
          # when the input is true; otherwise a full scrape.
          DRY="${{ inputs.dry_run }}"
          ARGS=""
          if [ "$DRY" = "true" ]; then ARGS="--dry-run"; fi
          docker run --rm \
            -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
            -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
            -e OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }} \
            -e NOTIFY_SECRET=${{ secrets.NOTIFY_SECRET }} \
            -e JWT_SECRET=${{ secrets.JWT_SECRET || 'scrape-dummy-jwt-secret' }} \
            -e PORT=8080 \
            -e TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }} \
            -e TELEGRAM_CHANNEL_ID=${{ secrets.TELEGRAM_CHANNEL_ID }} \
            -e TELEGRAM_CHANNEL_LINK=${{ secrets.TELEGRAM_CHANNEL_LINK }} \
            confnotifier:go scrape $ARGS
